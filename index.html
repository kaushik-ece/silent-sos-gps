<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silent SOS - Live Location</title>

    <!-- Leaflet Map -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #111;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .status {
            margin-top: 8px;
            font-size: 18px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 15px;
        }

        .info {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: green;
            color: white;
        }

    </style>

</head>


<body>

<div class="header">

    <h1>🚨 SILENT SOS</h1>

    <div class="status" id="status">
        GPS: NOT STARTED
    </div>

</div>


<div class="container">

    <button onclick="startGPS()">
        START LIVE LOCATION
    </button>


    <div class="info">

        <div class="row">
            <span class="label">Latitude</span>
            <span id="latitude">---</span>
        </div>

        <div class="row">
            <span class="label">Longitude</span>
            <span id="longitude">---</span>
        </div>

        <div class="row">
            <span class="label">Accuracy</span>
            <span id="accuracy">---</span>
        </div>

        <div class="row">
            <span class="label">Speed</span>
            <span id="speed">---</span>
        </div>

        <div class="row">
            <span class="label">Last Update</span>
            <span id="time">---</span>
        </div>

        <div class="row">
            <span class="label">Firebase</span>
            <span id="firebaseStatus">CONNECTING...</span>
        </div>

    </div>


    <div id="map"></div>

</div>


<!-- Leaflet -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- Firebase -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getDatabase,
        ref,
        set
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyC9bJFEZJEDpvZqN1tPbHErH232W1P0PTE",

        authDomain:
            "silentsos-c3bf9.firebaseapp.com",

        databaseURL:
            "https://silentsos-c3bf9-default-rtdb.firebaseio.com",

        projectId:
            "silentsos-c3bf9",

        storageBucket:
            "silentsos-c3bf9.firebasestorage.app",

        messagingSenderId:
            "110199256908",

        appId:
            "1:110199256908:web:dd6c8a0ecdaeccbe7cc1e9",

        measurementId:
            "G-ZK3LJ95F1P"
    };


    // =====================================================
    // FIREBASE INITIALIZATION
    // =====================================================

    const app =
        initializeApp(firebaseConfig);

    const database =
        getDatabase(app);


    document.getElementById(
        "firebaseStatus"
    ).innerHTML =
        "🟢 FIREBASE CONNECTED";


    // =====================================================
    // VARIABLES
    // =====================================================

    let map = null;

    let marker = null;

    let watchID = null;

    let latestLocation = null;

    let gpsStarted = false;


    // =====================================================
    // UPDATE MAP
    // =====================================================

    function updateMap(
        latitude,
        longitude
    )
    {

        // -------------------------------------------------
        // CREATE MAP FIRST TIME
        // -------------------------------------------------

        if (map === null)
        {

            map =
                L.map("map").setView(
                    [
                        latitude,
                        longitude
                    ],
                    18
                );


            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {

                    maxZoom: 19,

                    attribution:
                        "&copy; OpenStreetMap contributors"

                }
            ).addTo(map);


            marker =
                L.marker(
                    [
                        latitude,
                        longitude
                    ]
                ).addTo(map);


            marker.bindPopup(
                "📍 Current Location"
            ).openPopup();

        }

        // -------------------------------------------------
        // UPDATE EXISTING MAP
        // -------------------------------------------------

        else
        {

            marker.setLatLng(
                [
                    latitude,
                    longitude
                ]
            );


            map.setView(
                [
                    latitude,
                    longitude
                ]
            );

        }

    }


    // =====================================================
    // DISPLAY GPS LOCATION
    // =====================================================

    function displayLocation(
        latitude,
        longitude,
        accuracy,
        speed
    )
    {

        document.getElementById(
            "latitude"
        ).innerHTML =
            latitude.toFixed(6);


        document.getElementById(
            "longitude"
        ).innerHTML =
            longitude.toFixed(6);


        document.getElementById(
            "accuracy"
        ).innerHTML =
            accuracy.toFixed(2) + " m";


        if (speed !== null)
        {

            document.getElementById(
                "speed"
            ).innerHTML =
                speed.toFixed(2) + " m/s";

        }

        else
        {

            document.getElementById(
                "speed"
            ).innerHTML =
                "0 m/s";

        }


        document.getElementById(
            "time"
        ).innerHTML =
            new Date().toLocaleTimeString();


        document.getElementById(
            "status"
        ).innerHTML =
            "🟢 GPS LIVE";


        updateMap(
            latitude,
            longitude
        );

    }


    // =====================================================
    // SEND LOCATION TO FIREBASE
    // =====================================================

    async function sendLocationToFirebase()
    {

        // No GPS data yet
        if (
            latestLocation === null
        )
        {
            return;
        }


        const location =
            latestLocation;


        try
        {

            await set(
                ref(
                    database,
                    "locations/current"
                ),
                {

                    latitude:
                        location.latitude,

                    longitude:
                        location.longitude,

                    accuracy:
                        location.accuracy,

                    speed:
                        location.speed,

                    timestamp:
                        Date.now()

                }
            );


            document.getElementById(
                "firebaseStatus"
            ).innerHTML =
                "🟢 LOCATION SENT";


            console.log(
                "Firebase location sent:",
                location.latitude,
                location.longitude
            );

        }

        catch(error)
        {

            console.error(
                "Firebase error:",
                error
            );


            document.getElementById(
                "firebaseStatus"
            ).innerHTML =
                "❌ FIREBASE ERROR";

        }

    }


    // =====================================================
    // START GPS
    // =====================================================

    window.startGPS =
        function()
        {

            if (
                gpsStarted
            )
            {
                return;
            }


            gpsStarted =
                true;


            if (
                !navigator.geolocation
            )
            {

                document.getElementById(
                    "status"
                ).innerHTML =
                    "❌ GPS NOT SUPPORTED";

                return;

            }


            document.getElementById(
                "status"
            ).innerHTML =
                "🟡 GETTING LOCATION...";


            // ------------------------------------------------
            // START PHONE GPS
            // ------------------------------------------------

            watchID =
                navigator.geolocation.watchPosition(

                    function(position)
                    {

                        const latitude =
                            position.coords.latitude;


                        const longitude =
                            position.coords.longitude;


                        const accuracy =
                            position.coords.accuracy;


                        const speed =
                            position.coords.speed;


                        // ----------------------------------------
                        // SAVE LATEST GPS READING
                        // ----------------------------------------

                        latestLocation =
                        {

                            latitude:
                                latitude,

                            longitude:
                                longitude,

                            accuracy:
                                accuracy,

                            speed:
                                speed !== null
                                ? speed
                                : 0

                        };


                        // ----------------------------------------
                        // DISPLAY LOCATION
                        // ----------------------------------------

                        displayLocation(
                            latitude,
                            longitude,
                            accuracy,
                            speed
                        );


                        console.log(
                            "GPS:",
                            latitude,
                            longitude,
                            "Accuracy:",
                            accuracy
                        );

                    },


                    function(error)
                    {

                        document.getElementById(
                            "status"
                        ).innerHTML =
                            "❌ GPS ERROR: " +
                            error.message;


                        console.error(
                            "GPS error:",
                            error
                        );

                    },


                    {

                        enableHighAccuracy:
                            true,

                        maximumAge:
                            0,

                        timeout:
                            10000

                    }

                );


            // ------------------------------------------------
            // SEND LATEST LOCATION EVERY 1 SECOND
            // ------------------------------------------------

            setInterval(
                sendLocationToFirebase,
                1000
            );

        };


</script>

</body>
</html>
