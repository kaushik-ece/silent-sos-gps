<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silent SOS - Live Tracker</title>

    <!-- Leaflet for the map (free, no API key needed) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase (compat version - simplest to set up) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #0f1115;
        color: #e8e8e8;
      }
      header {
        padding: 16px 20px;
        background: #161923;
        border-bottom: 1px solid #262a36;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 18px;
        font-weight: 600;
      }
      #statusBadge {
        padding: 6px 16px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      .status-safe {
        background: #1f6e3f;
        color: #b6ffcf;
      }
      .status-armed {
        background: #7a5c00;
        color: #ffe9a8;
      }
      .status-danger {
        background: #7a1f1f;
        color: #ffc4c4;
        animation: pulse 1s infinite;
      }
      .status-unknown {
        background: #333;
        color: #aaa;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      #map {
        height: 60vh;
        width: 100%;
      }

      .infoPanel {
        padding: 16px 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      .card {
        background: #161923;
        border: 1px solid #262a36;
        border-radius: 12px;
        padding: 14px 16px;
      }
      .card .label {
        font-size: 12px;
        color: #8a8f9c;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .card .value {
        font-size: 20px;
        font-weight: 700;
        margin-top: 4px;
      }

      footer {
        padding: 12px 20px;
        text-align: center;
        color: #55596a;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Silent SOS — Live Tracker</h1>
      <div id="statusBadge" class="status-unknown">CONNECTING...</div>
    </header>

    <div id="map"></div>

    <div class="infoPanel">
      <div class="card">
        <div class="label">Last trigger source</div>
        <div class="value" id="sourceValue">--</div>
      </div>
      <div class="card">
        <div class="label">Battery</div>
        <div class="value" id="batteryValue">--</div>
      </div>
      <div class="card">
        <div class="label">Last updated</div>
        <div class="value" id="updatedValue">--</div>
      </div>
      <div class="card">
        <div class="label">Coordinates</div>
        <div class="value" id="coordsValue">--</div>
      </div>
    </div>

    <footer>Silent SOS Dashboard — auto-updates live from device</footer>

    <script>
      // ---------------------------------------------------------------
      // FIREBASE CONFIG - replace with YOUR project's config values
      // Get this from: Firebase Console -> Project Settings -> General
      // -> scroll to "Your apps" -> Web app -> Config
      // ---------------------------------------------------------------
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      // ---------------------------------------------------------------
      // MAP SETUP
      // ---------------------------------------------------------------
      const defaultLat = 13.0827; // Chennai as a fallback center
      const defaultLng = 80.2707;

      const map = L.map("map").setView([defaultLat, defaultLng], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      const marker = L.marker([defaultLat, defaultLng]).addTo(map);
      marker.bindPopup("Waiting for device data...").openPopup();

      // ---------------------------------------------------------------
      // LISTEN FOR LIVE UPDATES
      // Expected Firebase structure (adjust path to match your ESP32 code):
      //   /device/status   -> "SAFE" | "ARMED" | "DANGER"
      //   /device/lat      -> number
      //   /device/lng      -> number
      //   /device/source   -> "button" | "fall" | etc
      //   /device/battery  -> number (percent)
      //   /device/timestamp-> number (unix ms) or string
      // ---------------------------------------------------------------
      const deviceRef = db.ref("/device");

      deviceRef.on(
        "value",
        (snapshot) => {
          const data = snapshot.val();
          if (!data) return;

          // Update status badge
          const badge = document.getElementById("statusBadge");
          const status = (data.status || "UNKNOWN").toUpperCase();
          badge.textContent = status;
          badge.className = "";
          if (status === "SAFE") badge.classList.add("status-safe");
          else if (status === "ARMED") badge.classList.add("status-armed");
          else if (status === "DANGER") badge.classList.add("status-danger");
          else badge.classList.add("status-unknown");

          // Update info cards
          document.getElementById("sourceValue").textContent =
            data.source || "--";
          document.getElementById("batteryValue").textContent = data.battery
            ? data.battery + "%"
            : "--";
          document.getElementById("updatedValue").textContent = data.timestamp
            ? new Date(Number(data.timestamp)).toLocaleTimeString()
            : new Date().toLocaleTimeString();

          // Update map if we have coordinates
          if (data.lat && data.lng) {
            const lat = Number(data.lat);
            const lng = Number(data.lng);
            document.getElementById("coordsValue").textContent =
              lat.toFixed(5) + ", " + lng.toFixed(5);

            marker.setLatLng([lat, lng]);
            marker.bindPopup(
              `Status: ${status}<br>Updated: ${new Date().toLocaleTimeString()}`,
            );
            map.panTo([lat, lng]);
          }
        },
        (error) => {
          document.getElementById("statusBadge").textContent =
            "CONNECTION ERROR";
          document.getElementById("statusBadge").className = "status-unknown";
          console.error("Firebase read error:", error);
        },
      );
    </script>
  </body>
</html>
