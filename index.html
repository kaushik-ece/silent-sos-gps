<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silent SOS - Live Location</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #111;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .status {
            margin-top: 8px;
            font-size: 18px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 15px;
        }

        .info {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #008000;
            color: white;
        }

        button:active {
            background: #005500;
        }

    </style>

</head>


<body>

<div class="header">

    <h1>🚨 SILENT SOS</h1>

    <div class="status" id="status">
        GPS: NOT STARTED
    </div>

</div>


<div class="container">

    <button onclick="startGPS()">
        START LIVE LOCATION
    </button>


    <div class="info">

        <div class="row">
            <span class="label">Latitude</span>
            <span id="latitude">---</span>
        </div>

        <div class="row">
            <span class="label">Longitude</span>
            <span id="longitude">---</span>
        </div>

        <div class="row">
            <span class="label">Accuracy</span>
            <span id="accuracy">---</span>
        </div>

        <div class="row">
            <span class="label">Speed</span>
            <span id="speed">---</span>
        </div>

        <div class="row">
            <span class="label">Last Update</span>
            <span id="time">---</span>
        </div>

    </div>


    <div id="map"></div>

</div>


<!-- Leaflet JavaScript -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let watchID = null;

let map = null;

let marker = null;


// ========================================
// START GPS
// ========================================

function startGPS()
{

    if (!navigator.geolocation)
    {
        document.getElementById("status").innerHTML =
            "❌ GPS NOT SUPPORTED";

        return;
    }


    document.getElementById("status").innerHTML =
        "🟡 GETTING LOCATION...";


    watchID = navigator.geolocation.watchPosition(

        function(position)
        {

            let latitude =
                position.coords.latitude;

            let longitude =
                position.coords.longitude;

            let accuracy =
                position.coords.accuracy;

            let speed =
                position.coords.speed;


            // ========================================
            // DISPLAY GPS DATA
            // ========================================

            document.getElementById("latitude").innerHTML =
                latitude.toFixed(6);

            document.getElementById("longitude").innerHTML =
                longitude.toFixed(6);

            document.getElementById("accuracy").innerHTML =
                accuracy.toFixed(2) + " m";


            if (speed !== null)
            {
                document.getElementById("speed").innerHTML =
                    speed.toFixed(2) + " m/s";
            }
            else
            {
                document.getElementById("speed").innerHTML =
                    "0 m/s";
            }


            let now = new Date();

            document.getElementById("time").innerHTML =
                now.toLocaleTimeString();


            document.getElementById("status").innerHTML =
                "🟢 GPS LIVE";


            // ========================================
            // CREATE MAP
            // ========================================

            if (map === null)
            {

                map = L.map("map").setView(
                    [latitude, longitude],
                    18
                );


                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {
                        maxZoom: 19,
                        attribution:
                            "&copy; OpenStreetMap contributors"
                    }
                ).addTo(map);


                marker = L.marker(
                    [latitude, longitude]
                ).addTo(map);


                marker.bindPopup(
                    "📍 Current Location"
                ).openPopup();

            }

            else
            {

                // ========================================
                // MOVE MARKER
                // ========================================

                marker.setLatLng(
                    [latitude, longitude]
                );


                // Move map with person

                map.setView(
                    [latitude, longitude]
                );

            }

        },


        function(error)
        {

            document.getElementById("status").innerHTML =
                "❌ GPS ERROR: " + error.message;

        },


        {

            enableHighAccuracy: true,

            maximumAge: 0,

            timeout: 10000

        }

    );

}

</script>

</body>
</html>
