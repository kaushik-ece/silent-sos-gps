<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Silent SOS - Live Tracking Dashboard</title>

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
      }

      .header {
        background: #111;
        color: white;
        padding: 18px;
        text-align: center;
      }

      .header h1 {
        margin: 0;
      }

      .status {
        margin-top: 8px;
        font-size: 18px;
      }

      .container {
        max-width: 1000px;
        margin: auto;
        padding: 15px;
      }

      .info {
        background: white;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      .row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
      }

      .row:last-child {
        border-bottom: none;
      }

      .label {
        font-weight: bold;
      }

      #map {
        width: 100%;
        height: 600px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>🚨 SILENT SOS</h1>

      <div class="status" id="status">🟡 CONNECTING TO FIREBASE...</div>
    </div>

    <div class="container">
      <div class="info">
        <div class="row">
          <span class="label"> Latitude </span>

          <span id="latitude"> --- </span>
        </div>

        <div class="row">
          <span class="label"> Longitude </span>

          <span id="longitude"> --- </span>
        </div>

        <div class="row">
          <span class="label"> Accuracy </span>

          <span id="accuracy"> --- </span>
        </div>

        <div class="row">
          <span class="label"> Speed </span>

          <span id="speed"> --- </span>
        </div>

        <div class="row">
          <span class="label"> Last Update </span>

          <span id="time"> --- </span>
        </div>
      </div>

      <div id="map"></div>
    </div>

    <!-- Leaflet -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase -->

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

      import {
        getDatabase,
        ref,
        onValue,
      } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

      // ==========================================
      // FIREBASE CONFIG
      // ==========================================

      const firebaseConfig = {
        apiKey: "AIzaSyC9bJFEZJEDpvZqN1tPbHErH232W1P0PTE",

        authDomain: "silentsos-c3bf9.firebaseapp.com",

        databaseURL: "https://silentsos-c3bf9-default-rtdb.firebaseio.com",

        projectId: "silentsos-c3bf9",

        storageBucket: "silentsos-c3bf9.firebasestorage.app",

        messagingSenderId: "110199256908",

        appId: "1:110199256908:web:dd6c8a0ecdaeccbe7cc1e9",

        measurementId: "G-ZK3LJ95F1P",
      };

      // ==========================================
      // FIREBASE INITIALIZATION
      // ==========================================

      const app = initializeApp(firebaseConfig);

      const database = getDatabase(app);

      // ==========================================
      // LOCATION REFERENCE
      // ==========================================

      const locationRef = ref(database, "locations/current");

      // ==========================================
      // MAP VARIABLES
      // ==========================================

      let map = null;

      let marker = null;

      // ==========================================
      // LISTEN FOR LOCATION CHANGES
      // ==========================================

      onValue(
        locationRef,

        function (snapshot) {
          const data = snapshot.val();

          if (!data) {
            document.getElementById("status").innerHTML = "🔴 NO LOCATION DATA";

            return;
          }

          // ======================================
          // GET DATA
          // ======================================

          const latitude = data.latitude;

          const longitude = data.longitude;

          const accuracy = data.accuracy;

          const speed = data.speed;

          const timestamp = data.timestamp;

          // ======================================
          // DISPLAY DATA
          // ======================================

          document.getElementById("latitude").innerHTML =
            Number(latitude).toFixed(6);

          document.getElementById("longitude").innerHTML =
            Number(longitude).toFixed(6);

          document.getElementById("accuracy").innerHTML =
            Number(accuracy).toFixed(2) + " m";

          document.getElementById("speed").innerHTML =
            Number(speed).toFixed(2) + " m/s";

          if (timestamp) {
            document.getElementById("time").innerHTML = new Date(
              timestamp,
            ).toLocaleTimeString();
          }

          document.getElementById("status").innerHTML = "🟢 LIVE LOCATION";

          // ======================================
          // CREATE MAP
          // ======================================

          if (map === null) {
            map = L.map("map").setView([latitude, longitude], 18);

            L.tileLayer(
              "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

              {
                maxZoom: 19,

                attribution: "&copy; OpenStreetMap contributors",
              },
            ).addTo(map);

            marker = L.marker([latitude, longitude]).addTo(map);

            marker.bindPopup("📍 LIVE LOCATION").openPopup();
          }

          // ======================================
          // MOVE MARKER
          // ======================================
          else {
            marker.setLatLng([latitude, longitude]);

            map.setView([latitude, longitude]);
          }
        },
      );
    </script>
  </body>
</html>
