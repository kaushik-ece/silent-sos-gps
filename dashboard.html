<!doctype html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silent SOS - Live Tracking Dashboard</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #111;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .status {
            margin-top: 8px;
            font-size: 18px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 15px;
        }

        .info {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

    </style>

</head>


<body>


<div class="header">

    <h1>🚨 SILENT SOS</h1>

    <div
        class="status"
        id="status">
        🟡 CONNECTING TO FIREBASE...
    </div>

</div>


<div class="container">


    <div class="info">

        <div class="row">
            <span class="label">Latitude</span>
            <span id="latitude">---</span>
        </div>


        <div class="row">
            <span class="label">Longitude</span>
            <span id="longitude">---</span>
        </div>


        <div class="row">
            <span class="label">Accuracy</span>
            <span id="accuracy">---</span>
        </div>


        <div class="row">
            <span class="label">Speed</span>
            <span id="speed">---</span>
        </div>


        <div class="row">
            <span class="label">Last Update</span>
            <span id="time">---</span>
        </div>


    </div>


    <div id="map"></div>


</div>


<!-- Leaflet -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- Firebase -->

<script type="module">


    // =====================================================
    // FIREBASE IMPORTS
    // =====================================================

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getDatabase,
        ref,
        onValue
    }
    from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyC9bJFEZJEDpvZqN1tPbHErH232W1P0PTE",

        authDomain:
            "silentsos-c3bf9.firebaseapp.com",

        databaseURL:
            "https://silentsos-c3bf9-default-rtdb.firebaseio.com",

        projectId:
            "silentsos-c3bf9",

        storageBucket:
            "silentsos-c3bf9.firebasestorage.app",

        messagingSenderId:
            "110199256908",

        appId:
            "1:110199256908:web:dd6c8a0ecdaeccbe7cc1e9",

        measurementId:
            "G-ZK3LJ95F1P"

    };


    // =====================================================
    // INITIALIZE FIREBASE
    // =====================================================

    const app =
        initializeApp(
            firebaseConfig
        );


    const database =
        getDatabase(app);


    // =====================================================
    // FIREBASE LOCATION
    // =====================================================

    const locationRef =
        ref(
            database,
            "locations/current"
        );


    // =====================================================
    // MAP VARIABLES
    // =====================================================

    let map = null;

    let marker = null;


    // =====================================================
    // LAST LOCATION
    // =====================================================

    let lastLatitude = null;

    let lastLongitude = null;


    // =====================================================
    // FIREBASE LIVE LISTENER
    // =====================================================

    onValue(

        locationRef,

        function(snapshot)
        {

            const data =
                snapshot.val();


            // ------------------------------------------------
            // NO DATA
            // ------------------------------------------------

            if (!data)
            {

                document.getElementById(
                    "status"
                ).innerHTML =
                    "🔴 NO LOCATION DATA";

                return;

            }


            // ------------------------------------------------
            // READ LOCATION
            // ------------------------------------------------

            const latitude =
                Number(
                    data.latitude
                );


            const longitude =
                Number(
                    data.longitude
                );


            const accuracy =
                Number(
                    data.accuracy
                );


            const speed =
                Number(
                    data.speed
                );


            const timestamp =
                Number(
                    data.timestamp
                );


            // ------------------------------------------------
            // VALIDATE LOCATION
            // ------------------------------------------------

            if (
                !Number.isFinite(latitude) ||
                !Number.isFinite(longitude)
            )
            {

                document.getElementById(
                    "status"
                ).innerHTML =
                    "🔴 INVALID LOCATION";

                return;

            }


            // ------------------------------------------------
            // DISPLAY LATITUDE
            // ------------------------------------------------

            document.getElementById(
                "latitude"
            ).innerHTML =
                latitude.toFixed(6);


            // ------------------------------------------------
            // DISPLAY LONGITUDE
            // ------------------------------------------------

            document.getElementById(
                "longitude"
            ).innerHTML =
                longitude.toFixed(6);


            // ------------------------------------------------
            // DISPLAY ACCURACY
            // ------------------------------------------------

            if (
                Number.isFinite(accuracy)
            )
            {

                document.getElementById(
                    "accuracy"
                ).innerHTML =
                    accuracy.toFixed(2)
                    + " m";

            }


            // ------------------------------------------------
            // DISPLAY SPEED
            // ------------------------------------------------

            if (
                Number.isFinite(speed)
            )
            {

                document.getElementById(
                    "speed"
                ).innerHTML =
                    speed.toFixed(2)
                    + " m/s";

            }


            // ------------------------------------------------
            // DISPLAY TIME
            // ------------------------------------------------

            if (
                Number.isFinite(timestamp)
            )
            {

                document.getElementById(
                    "time"
                ).innerHTML =
                    new Date(
                        timestamp
                    ).toLocaleTimeString();

            }


            // ------------------------------------------------
            // STATUS
            // ------------------------------------------------

            document.getElementById(
                "status"
            ).innerHTML =
                "🟢 LIVE LOCATION";


            // =================================================
            // CREATE MAP
            // =================================================

            if (
                map === null
            )
            {

                map =
                    L.map(
                        "map"
                    ).setView(
                        [
                            latitude,
                            longitude
                        ],
                        18
                    );


                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {

                        maxZoom: 19,

                        attribution:
                            "&copy; OpenStreetMap contributors"

                    }
                ).addTo(map);


                marker =
                    L.marker(
                        [
                            latitude,
                            longitude
                        ]
                    ).addTo(map);


                marker.bindPopup(
                    "📍 LIVE LOCATION"
                ).openPopup();


                lastLatitude =
                    latitude;


                lastLongitude =
                    longitude;


                return;

            }


            // =================================================
            // MOVE MARKER ONLY WHEN LOCATION CHANGES
            // =================================================

            if (
                latitude !== lastLatitude ||
                longitude !== lastLongitude
            )
            {

                marker.setLatLng(
                    [
                        latitude,
                        longitude
                    ]
                );


                map.setView(
                    [
                        latitude,
                        longitude
                    ]
                );


                lastLatitude =
                    latitude;


                lastLongitude =
                    longitude;

            }

        },


        function(error)
        {

            console.error(
                "Firebase listener error:",
                error
            );


            document.getElementById(
                "status"
            ).innerHTML =
                "🔴 FIREBASE ERROR";

        }

    );


</script>


</body>
</html>
